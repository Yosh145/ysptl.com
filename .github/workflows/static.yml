name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch uses the old naming convention

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # OPTIONAL: BUILD STEP FOR FRAMEWORKS
      # If you use React, Vue, Astro, etc., uncomment the lines below.
      # If you just use raw HTML/CSS/JS, leave these commented out.
      # ==========================================
      # - name: Install Dependencies
      #   run: npm ci
      # - name: Build Site
      #   run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # If using a framework build step, change this to your build output directory (e.g., 'dist', 'build', '_site')
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
